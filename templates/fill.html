<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Profile</title>

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --accent: #0ea5a4;
      --border: #e2e8f0;
      --shadow: 0 20px 50px rgba(0,0,0,0.15);
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: 0.3s;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow);
      animation: fadeIn 0.5s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 14px;
    }

    .toggle {
      text-align: right;
      margin-bottom: 10px;
    }

    .toggle button {
      border: none;
      background: var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 13px;
      margin-bottom: 4px;
    }

    input, select {
      padding: 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button.submit-btn {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--primary), #1e3a8a);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button.submit-btn:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="toggle">
    <button onclick="toggleTheme()">🌙 / ☀️</button>
  </div>

  <h2>Complete Your Profile</h2>
  <p class="subtitle">Personalize your health experience</p>

  <form method="POST" action="/save-profile">

    <div class="grid">
      <div class="form-group">
        <label>Age</label>
        <input type="number" name="age" required>
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select name="gender">
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>Height (cm)</label>
        <input type="number" name="height" required>
      </div>

      <div class="form-group">
        <label>Weight (kg)</label>
        <input type="number" name="weight" required>
      </div>
    </div>

    <div class="form-group">
      <label>Blood Group</label>
      <select name="blood_group">
        <option>A+</option><option>B+</option><option>O+</option><option>AB+</option>
      </select>
    </div>

    <div class="form-group">
      <label>Allergies</label>
      <input type="text" name="allergies">
    </div>

    <div class="form-group">
      <label>Chronic Conditions</label>
      <input type="text" name="chronic_conditions">
    </div>

    <div class="form-group">
      <label>Emergency Contact Name</label>
      <input type="text" name="emergency_contact_name">
    </div>

    <div class="form-group">
      <label>Emergency Contact Phone</label>
      <input type="text" name="emergency_contact_phone">
    </div>

    <div class="form-group">
      <label>Primary Goal</label>
      <input type="text" name="primary_goal">
    </div>

    <div class="form-group">
      <label>City</label>
      <input type="text" name="city">
    </div>

    <button class="submit-btn" type="submit">Save & Continue</button>

  </form>

</div>

<script>
function toggleTheme() {
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
