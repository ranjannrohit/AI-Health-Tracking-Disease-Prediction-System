<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Profile</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#2563EB,#0EA5A4);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.container {
  width: 95%;
  max-width: 500px;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  animation: fadeIn 0.6s ease;
}

h2 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #64748B;
  margin-bottom: 25px;
}

.form-group {
  margin-bottom: 18px;
  display: flex;
  flex-direction: column;
}

label {
  font-weight: 600;
  margin-bottom: 6px;
}

input, select {
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #E2E8F0;
  font-size: 14px;
  transition: 0.2s;
}

input:focus, select:focus {
  border-color: #2563EB;
  outline: none;
  box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg,#2563EB,#1E3A8A);
  color: white;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-2px);
}

.progress {
  height: 6px;
  background: #E2E8F0;
  border-radius: 999px;
  margin-bottom: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#2563EB,#0EA5A4);
  transition: width 0.3s;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">

  <h2>🧬 Complete Your Profile</h2>
  <p class="subtitle">Help us personalize your health insights</p>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <form id="profileForm">

    <div class="form-group">
      <label>👤 Age</label>
      <input type="number" id="age" required>
    </div>

    <div class="form-group">
      <label>⚧ Gender</label>
      <select id="gender">
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>📏 Height (cm)</label>
      <input type="number" id="height" required>
    </div>

    <div class="form-group">
      <label>⚖ Weight (kg)</label>
      <input type="number" id="weight" required>
    </div>

    <div class="form-group">
      <label>🩸 Blood Group</label>
      <select id="blood">
        <option>A+</option><option>A-</option>
        <option>B+</option><option>B-</option>
        <option>O+</option><option>O-</option>
        <option>AB+</option><option>AB-</option>
      </select>
    </div>

    <div class="form-group">
      <label>💉 Do you have any chronic disease?</label>
      <select id="disease">
        <option>No</option>
        <option>Diabetes</option>
        <option>Heart Disease</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>🚬 Smoking Habit</label>
      <select id="smoking">
        <option>No</option>
        <option>Occasionally</option>
        <option>Regular</option>
      </select>
    </div>

    <div class="form-group">
      <label>🏃 Activity Level</label>
      <select id="activity">
        <option>Low</option>
        <option>Moderate</option>
        <option>High</option>
      </select>
    </div>

    <button type="submit">Save & Continue</button>

  </form>

</div>

<script>
const form = document.getElementById("profileForm");
const progressBar = document.getElementById("progressBar");
const inputs = form.querySelectorAll("input, select");

inputs.forEach(input => {
  input.addEventListener("input", updateProgress);
});

function updateProgress() {
  let filled = 0;
  inputs.forEach(i => {
    if (i.value) filled++;
  });
  let percent = (filled / inputs.length) * 100;
  progressBar.style.width = percent + "%";
}

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const data = {
    age: age.value,
    gender: gender.value,
    height: height.value,
    weight: weight.value,
    blood: blood.value,
    disease: disease.value,
    smoking: smoking.value,
    activity: activity.value
  };

  // Save ALL values
  localStorage.setItem("userProfile", JSON.stringify(data));
  localStorage.setItem("profileFilled", "true");

  // Redirect
  window.location.href = "/dashboard";
});
</script>

</body>
</html>
