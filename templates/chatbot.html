{% extends "base.html" %}
{% block content %}

<style>
body {
    background: linear-gradient(135deg,#0f172a,#1e293b);
    font-family: 'Poppins', sans-serif;
}

.chat-wrapper {
    max-width: 900px;
    margin: 40px auto;
    background: #0b1220;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    height: 85vh;
}

/* HEADER */
.chat-header {
    padding: 18px 20px;
    background: linear-gradient(135deg,#2563eb,#0ea5a4);
    color: white;
    display: flex;
    align-items: center;
    gap: 12px;
}

.chat-header i {
    margin-left: 8px;
}

.chat-header h2 {
    margin: 0 0 0 -4px;
    font-size: 22px;
}

/* BODY */
.chat-body {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    background: #020617;
}

/* MESSAGE */
.message {
    max-width: 70%;
    padding: 12px 16px;
    margin-bottom: 12px;
    border-radius: 14px;
    font-size: 14px;
}

.user {
    background: #2563eb;
    color: white;
    margin-left: auto;
}

.bot {
    background: #1e293b;
    color: #e2e8f0;
}

/* INPUT */
.chat-input-area {
    display: flex;
    padding: 14px;
    border-top: 1px solid #1e293b;
    background: #020617;
}

.chat-input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: #1e293b;
    color: white;
}

.send-btn {
    margin-left: 10px;
    background: linear-gradient(135deg,#2563eb,#1e40af);
    border: none;
    padding: 12px 16px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
}
</style>

<div class="chat-wrapper">

```
<!-- HEADER -->
<div class="chat-header">
    <i data-lucide="bot"></i>
    <h2>Health Assistant</h2>
</div>

<!-- BODY -->
<div class="chat-body" id="chatBody"></div>

<!-- INPUT (NO FORM) -->
<div class="chat-input-area">
    <input 
        type="text" 
        id="chatInput" 
        class="chat-input" 
        placeholder="Ask about your health..."
    >
    <button class="send-btn" onclick="sendMessage()">
        <i data-lucide="send"></i>
    </button>
</div>
```

</div>

<script src="https://unpkg.com/lucide@latest"></script>

<script>
lucide.createIcons();

const input = document.getElementById("chatInput");
const chatBody = document.getElementById("chatBody");

// add message
function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;

    chatBody.appendChild(div);
    chatBody.scrollTop = chatBody.scrollHeight;
}

// send message
function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    fetch("/chatbot?message=" + encodeURIComponent(message))
    .then(res => res.json())
    .then(data => {
        addMessage(data.bot, "bot");
    })
    .catch(() => {
        addMessage("Server error", "bot");
    });
}

// ENTER KEY SUPPORT
input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});
function sendMessage() {
    const input = document.getElementById("chatInput");
    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    fetch("/chatbot?message=" + encodeURIComponent(message))
    .then(res => res.json())
    .then(data => {
        addMessage(data.bot, "bot");
    })
    .catch(() => {
        addMessage("Server error", "bot");
    });
}
</script>

{% endblock %}
