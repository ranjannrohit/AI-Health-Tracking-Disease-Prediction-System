<!DOCTYPE html>
<html>
<head>
    <title>Stroke Prediction</title>
</head>
<body>

<h2>Stroke Risk Prediction</h2>

<form method="POST">

    <label>Age:</label>
    <input type="number" name="age" required><br><br>

    <label>Hypertension (0 = No, 1 = Yes):</label>
    <input type="number" name="hypertension" min="0" max="1" required><br><br>

    <label>Heart Disease (0 = No, 1 = Yes):</label>
    <input type="number" name="heart_disease" min="0" max="1" required><br><br>

    <label>Average Glucose Level:</label>
    <input type="number" step="0.1" name="avg_glucose" required><br><br>

    <label>BMI:</label>
    <input type="number" step="0.1" name="bmi" required><br><br>

    <button type="submit">Predict</button>
</form>

{% if result %}
    <h3>Result: {{ result }}</h3>
    <h3>Probability: {{ probability }}%</h3>
    <h3>Risk Level: {{ risk_level }}</h3>
{% endif %}
{% if recommendation %}
    <h3>Recommendation:</h3>
    <p>{{ recommendation }}</p>
{% endif %}

<br>
<a href="/">Back to Home</a>

</body>
</html>
