{% extends "base.html" %}

{% block content %}

<div class="success-wrapper">

    <canvas id="confetti-canvas"></canvas>

    <div class="success-card">

        <div class="checkmark-circle">
            <div class="checkmark"></div>
        </div>

        <h2>Account Created Successfully 🎉</h2>
        <p>Your HealthTrackk account has been verified.</p>
        <p class="redirect-text">Redirecting to login...</p>

    </div>

</div>

<!-- Success Sound -->
<audio id="successSound" autoplay>
    <source src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" type="audio/mpeg">
</audio>

<style>

/* ===============================
   WRAPPER
================================ */

.success-wrapper {
    min-height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

/* Confetti Canvas */
#confetti-canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
}

/* ===============================
   CARD
================================ */

.success-card {
    position: relative;
    z-index: 2;
    background: var(--card);
    padding: 70px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 50px 100px rgba(0,0,0,0.2);
    border: 1px solid var(--border);
    backdrop-filter: blur(18px);
    animation: fadeUp 0.8s ease forwards;
}

.success-card h2 {
    font-size: 30px;
    margin-bottom: 10px;
}

.success-card p {
    color: var(--text-light);
}

.redirect-text {
    margin-top: 8px;
    font-size: 14px;
    opacity: 0.7;
}

/* ===============================
   CHECKMARK
================================ */

.checkmark-circle {
    width: 130px;
    height: 130px;
    background: linear-gradient(135deg,#22c55e,#16a34a);
    border-radius: 50%;
    position: relative;
    margin: 0 auto 35px;
    box-shadow: 0 30px 60px rgba(34,197,94,0.45);
    animation: pop 0.5s ease forwards;
}

.checkmark {
    width: 35px;
    height: 70px;
    border-right: 7px solid white;
    border-bottom: 7px solid white;
    transform: rotate(45deg);
    position: absolute;
    top: 30px;
    left: 48px;
}

/* ===============================
   ANIMATIONS
================================ */

@keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===============================
   RESPONSIVE
================================ */

@media(max-width:600px){
    .success-card {
        padding: 45px;
    }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* 🎉 CONFETTI BLAST */

const duration = 2 * 1000;
const end = Date.now() + duration;

(function frame() {
    confetti({
        particleCount: 4,
        angle: 60,
        spread: 55,
        origin: { x: 0 }
    });
    confetti({
        particleCount: 4,
        angle: 120,
        spread: 55,
        origin: { x: 1 }
    });

    if (Date.now() < end) {
        requestAnimationFrame(frame);
    }
})();

/* 🔊 Play Sound */
document.getElementById("successSound").play().catch(() => {});

/* 🚀 Redirect */
setTimeout(function(){
    window.location.href = "/login";
}, 3500);

</script>

{% endblock %}
