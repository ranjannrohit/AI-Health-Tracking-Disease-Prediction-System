{% extends "base.html" %}
{% block content %}

<style>

/* ===============================
   BACKGROUND MEDICAL VISUALS
================================ */

.auth-section {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    position: relative;
    overflow: hidden;
}

/* Soft medical gradient */
.auth-section::before {
    content: "";
    position: absolute;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(37,99,235,0.15), transparent 70%);
    top: -200px;
    right: -200px;
    animation: floatGlow 10s ease-in-out infinite alternate;
}

/* Floating Medical Icons */
.bg-icon {
    position: absolute;
    font-size: 40px;
    opacity: 0.07;
    animation: float 8s ease-in-out infinite;
}

.bg-icon.heart { top: 25%; left: 12%; }
.bg-icon.lock { top: 60%; left: 75%; animation-delay:2s; }
.bg-icon.shield { top: 75%; left: 20%; animation-delay:1s; }
.bg-icon.wave { top: 35%; left: 80%; animation-delay:3s; }

/* ===============================
   CARD
================================ */

.auth-card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 55px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.12);
    backdrop-filter: blur(15px);
    position: relative;
    z-index: 2;
    animation: fadeUp 0.8s ease forwards;
}

/* Header */

.auth-header {
    text-align: center;
    margin-bottom: 35px;
}

.auth-icon {
    margin-bottom: 10px;
}

.auth-icon i {
    width: 60px;
    height: 60px;
    stroke-width: 1.8;
    color: #2563EB;
    filter: drop-shadow(0 0 10px rgba(37,99,235,0.5));
    animation: float 3s ease-in-out infinite;
}

.auth-header h2 {
    font-size: 30px;
    margin-bottom: 8px;
}

.auth-sub {
    font-size: 14px;
    color: var(--text-light);
}

/* ===============================
   INPUTS
================================ */

.input-group {
    position: relative;
    margin-bottom: 22px;
}

.input-group i {
    position: absolute;
    top: 50%;
    left: 18px;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    stroke-width: 2;
    color: #2563EB;
}

.auth-input {
    width: 100%;
    padding: 18px 18px 18px 55px;
    border-radius: 14px;
    border: 1px solid var(--border);
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s ease;
}

.auth-input:focus {
    outline: none;
    border-color: #2563EB;
    box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
}

/* ===============================
   BUTTON
================================ */

.auth-btn {
    width: 100%;
    padding: 20px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg,#2563EB,#1E3A8A);
    color: white;
    cursor: pointer;
    transition: 0.3s ease;
    box-shadow: 0 20px 50px rgba(37,99,235,0.35);
}

.auth-btn:hover {
    transform: translateY(-5px);
    box-shadow: 0 30px 70px rgba(37,99,235,0.5);
}

/* ===============================
   FOOTER
================================ */

.auth-footer {
    margin-top: 30px;
    text-align: center;
    font-size: 14px;
}

.auth-footer a {
    color: #2563EB;
    font-weight: 600;
    text-decoration: none;
}

.auth-footer a:hover {
    text-decoration: underline;
}

/* ===============================
   ANIMATIONS
================================ */

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

@keyframes floatGlow {
    from { transform: translate(0,0); }
    to { transform: translate(40px,-40px); }
}

</style>

<div class="auth-section">

    <!-- Floating Background Icons -->
    <div class="bg-icon heart">❤️</div>
    <div class="bg-icon lock">🔐</div>
    <div class="bg-icon shield">🛡️</div>
    <div class="bg-icon wave">💓</div>

    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">
                <i data-lucide="shield-check"></i>
            </div>
            <h2>Welcome Back</h2>
            <p class="auth-sub">Secure access to your AI health dashboard</p>
        </div>

        <form method="POST">

            <div class="input-group">
                <i data-lucide="mail"></i>
                <input type="email" name="email" placeholder="Email Address" required class="auth-input">
            </div>

            <div class="input-group">
                <i data-lucide="lock"></i>
                <input type="password" name="password" placeholder="Password" required class="auth-input">
            </div>

            <button type="submit" class="auth-btn">
                Login Securely
            </button>

        </form>

        <div class="auth-footer">
            Don’t have an account?
            <a href="/register">Create one</a>
        </div>

    </div>
</div>

<script>
lucide.createIcons();
</script>

{% endblock %}
