{% extends "base.html" %}
{% block content %}

<style>
/* ===============================
   PAGE
================================ */

.auth-section {
    min-height: calc(100vh - 86px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at top left, rgba(37,99,235,0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(14,165,164,0.16), transparent 30%);
}

/* Glow blobs */
.auth-section::before,
.auth-section::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(12px);
    pointer-events: none;
    z-index: 0;
}

.auth-section::before {
    width: 460px;
    height: 460px;
    background: radial-gradient(circle, rgba(37,99,235,0.32), transparent 70%);
    top: -120px;
    right: -120px;
    animation: floatGlowA 10s ease-in-out infinite alternate;
}

.auth-section::after {
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, rgba(14,165,164,0.26), transparent 70%);
    bottom: -100px;
    left: -80px;
    animation: floatGlowB 12s ease-in-out infinite alternate;
}

/* ECG background */
.ecg-bg {
    position: absolute;
    inset: 0;
    opacity: 0.18;
    z-index: 0;
    pointer-events: none;
}

.ecg-bg svg {
    width: 100%;
    height: 100%;
}

.ecg-line {
    fill: none;
    stroke: #22C55E;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1800;
    stroke-dashoffset: 1800;
    animation: ecgDraw 7s linear infinite;
    filter: drop-shadow(0 0 6px rgba(34,197,94,0.45));
}

/* Floating icons */
.bg-icon {
    position: absolute;
    z-index: 0;
    opacity: 0.14;
    color: var(--text);
    animation: float 8s ease-in-out infinite;
}

.bg-icon i {
    width: 42px;
    height: 42px;
}

.bg-icon.heart { top: 22%; left: 12%; }
.bg-icon.lock { top: 62%; left: 78%; animation-delay: 2s; }
.bg-icon.shield { top: 76%; left: 20%; animation-delay: 1s; }
.bg-icon.wave { top: 34%; left: 82%; animation-delay: 3s; }

/* Small particles */
.particle {
    position: absolute;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
}

.particle.p1 {
    width: 10px;
    height: 10px;
    top: 18%;
    left: 28%;
    background: rgba(37,99,235,0.42);
    animation: particleFloat 8s ease-in-out infinite;
}

.particle.p2 {
    width: 14px;
    height: 14px;
    top: 22%;
    right: 24%;
    background: rgba(14,165,164,0.44);
    animation: particleFloat 9s ease-in-out infinite 1s;
}

.particle.p3 {
    width: 18px;
    height: 18px;
    bottom: 18%;
    right: 18%;
    background: rgba(99,102,241,0.30);
    animation: particleFloat 10s ease-in-out infinite 2s;
}

/* ===============================
   CARD
================================ */

.auth-card {
    width: 100%;
    max-width: 470px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 26px;
    padding: 38px 34px;
    box-shadow: 0 36px 90px rgba(15,23,42,0.16);
    position: relative;
    z-index: 2;
    animation: fadeUp 0.8s ease forwards;
    overflow: hidden;
}

html.dark .auth-card {
    background: rgba(15,23,42,0.68);
    border: 1px solid rgba(255,255,255,0.10);
}

.auth-card::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    top: -60px;
    right: -60px;
    background: radial-gradient(circle, rgba(37,99,235,0.20), transparent 70%);
    pointer-events: none;
}

/* Header */

.auth-header {
    text-align: center;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
}

.auth-icon {
    width: 74px;
    height: 74px;
    margin: 0 auto 16px;
    border-radius: 22px;
    background: linear-gradient(135deg,#2563EB,#1E3A8A);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 22px 50px rgba(37,99,235,0.32);
    animation: float 4s ease-in-out infinite;
}

.auth-icon i {
    width: 34px;
    height: 34px;
}

.auth-header h2 {
    font-size: 30px;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
}

.auth-sub {
    font-size: 14px;
    color: var(--text-light);
}

/* Chips */

.auth-chips {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
}

.auth-chip {
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.56);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-light);
}

html.dark .auth-chip {
    background: rgba(255,255,255,0.08);
}

/* Form */

.auth-form {
    position: relative;
    z-index: 1;
}

.input-group {
    position: relative;
    margin-bottom: 18px;
}

.input-group .left-icon {
    position: absolute;
    top: 50%;
    left: 16px;
    transform: translateY(-50%);
    color: #2563EB;
    z-index: 2;
}

.input-group .left-icon i,
.toggle-password i {
    width: 18px;
    height: 18px;
}

.auth-input {
    width: 100%;
    padding: 17px 50px 17px 48px;
    border-radius: 16px;
    border: 1px solid var(--border);
    font-size: 15px;
    background: rgba(255,255,255,0.62);
    color: var(--text);
    transition: 0.28s ease;
}

html.dark .auth-input {
    background: rgba(255,255,255,0.07);
}

.auth-input:focus {
    outline: none;
    border-color: #2563EB;
    box-shadow: 0 0 0 4px rgba(37,99,235,0.16);
    transform: translateY(-1px);
}

.toggle-password {
    position: absolute;
    top: 50%;
    right: 14px;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--text-light);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Meta row */

.meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    font-size: 13px;
}

.remember-wrap {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-light);
}

.remember-wrap input {
    accent-color: #2563EB;
}

.forgot-link {
    color: #2563EB;
    font-weight: 700;
    text-decoration: none;
}

.forgot-link:hover {
    text-decoration: underline;
}

/* Button */

.auth-btn {
    width: 100%;
    padding: 18px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 18px;
    border: none;
    background: linear-gradient(135deg,#2563EB,#1E3A8A);
    color: white;
    cursor: pointer;
    transition: 0.28s ease;
    box-shadow: 0 22px 52px rgba(37,99,235,0.36);
    position: relative;
    overflow: hidden;
}

.auth-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 80%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
    transition: 0.6s ease;
}

.auth-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 28px 60px rgba(37,99,235,0.48);
}

.auth-btn:hover::before {
    left: 130%;
}

/* Footer */

.auth-footer {
    margin-top: 22px;
    text-align: center;
    font-size: 14px;
    position: relative;
    z-index: 1;
}

.auth-footer a {
    color: #2563EB;
    font-weight: 700;
    text-decoration: none;
}

.auth-footer a:hover {
    text-decoration: underline;
}

/* Animations */

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

@keyframes floatGlowA {
    from { transform: translate(0,0); }
    to { transform: translate(40px,-34px); }
}

@keyframes floatGlowB {
    from { transform: translate(0,0); }
    to { transform: translate(-28px,34px); }
}

@keyframes particleFloat {
    0% { transform: translateY(0px) translateX(0px); }
    50% { transform: translateY(-14px) translateX(6px); }
    100% { transform: translateY(0px) translateX(0px); }
}

@keyframes ecgDraw {
    to { stroke-dashoffset: 0; }
}

/* Responsive */

@media (max-width: 640px) {
    .auth-section {
        padding: 20px 12px;
    }

    .auth-card {
        padding: 28px 20px;
        border-radius: 22px;
    }

    .auth-header h2 {
        font-size: 24px;
    }

    .meta-row {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>

<div class="auth-section">

    <div class="ecg-bg">
        <svg viewBox="0 0 1600 500" preserveAspectRatio="none">
            <path class="ecg-line"
                d="M0 250
                   L90 250
                   L110 210
                   L130 290
                   L150 240
                   L240 240
                   L260 170
                   L280 320
                   L300 240
                   L430 240
                   L450 210
                   L470 285
                   L490 245
                   L640 245
                   L660 180
                   L680 325
                   L700 240
                   L900 240
                   L920 210
                   L940 290
                   L960 245
                   L1160 245
                   L1180 185
                   L1200 320
                   L1220 240
                   L1600 240" />
        </svg>
    </div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>

    <div class="bg-icon heart"><i data-lucide="heart-pulse"></i></div>
    <div class="bg-icon lock"><i data-lucide="lock-keyhole"></i></div>
    <div class="bg-icon shield"><i data-lucide="shield-check"></i></div>
    <div class="bg-icon wave"><i data-lucide="activity"></i></div>

    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">
                <i data-lucide="shield-check"></i>
            </div>
            <h2>Welcome Back</h2>
            <p class="auth-sub">Secure access</p>
        </div>

        <div class="auth-chips">
            <span class="auth-chip">🔐 Secure</span>
            <span class="auth-chip">🧠 AI Ready</span>
            <span class="auth-chip">⚡ Fast Access</span>
        </div>

        <form method="POST" class="auth-form">

            <div class="input-group">
                <span class="left-icon"><i data-lucide="mail"></i></span>
                <input type="email" name="email" placeholder="Email Address" required class="auth-input">
            </div>

            <div class="input-group">
                <span class="left-icon"><i data-lucide="lock"></i></span>
                <input type="password" id="passwordInput" name="password" placeholder="Password" required class="auth-input">
                <button type="button" class="toggle-password" id="togglePassword">
                    <i data-lucide="eye"></i>
                </button>
            </div>

            <div class="meta-row">
                <label class="remember-wrap">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>

                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="auth-btn">
                Login Securely
            </button>

        </form>

        <div class="auth-footer">
            Don’t have an account?
            <a href="/register">Create one</a>
        </div>

    </div>
</div>

<script>
lucide.createIcons();

const togglePassword = document.getElementById("togglePassword");
const passwordInput = document.getElementById("passwordInput");

if (togglePassword && passwordInput) {
    togglePassword.addEventListener("click", function () {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";

        this.innerHTML = isPassword
            ? '<i data-lucide="eye-off"></i>'
            : '<i data-lucide="eye"></i>';

        lucide.createIcons();
    });
}
</script>

{% endblock %}
