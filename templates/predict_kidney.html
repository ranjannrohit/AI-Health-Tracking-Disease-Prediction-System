<!DOCTYPE html>
<html>
<head>
    <title>Kidney Disease Prediction</title>
</head>
<body>

<h2>Kidney Disease Prediction</h2>

<form method="POST">

    <label>Creatinine Level (mg/dL):</label>
    <input type="number" step="0.1" name="creatinine" required><br><br>

    <button type="submit">Predict</button>
</form>

{% if result %}
    <h3>Result: {{ result }}</h3>
    <h3>Probability: {{ probability }}%</h3>
    <h3>Risk Level: {{ risk_level }}</h3>
{% endif %}
{% if recommendation %}
    <h3>Recommendation:</h3>
    <p>{{ recommendation }}</p>
{% endif %}


<br>
<a href="/">Back to Home</a>

</body>
</html>
